<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Spotify Callback</title>
</head>
<body>
  <p>Login erfolgreich, bitte warten...</p>
  <script>
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const token = params.get("access_token");

    if (token) {
      localStorage.setItem("access_token", token);
      window.location.href = "https://secka1.github.io/portfolio-page/";
    } else {
      document.body.innerHTML = "<p>Kein Token erhalten.</p>";
    }
  </script>
</body>
</html>
